<div class="global-loader" *ngIf="iobjloadingService.iboolLoading()">
  <div class="spinner-border text-primary" role="status"></div>
</div>
<div class="app-shell">
  <nav *ngIf="iboolShowSidebar" class="app-sidebar" aria-label="Main navigation">
    <div class="app-sidebar__brand" routerLink="/dashboard" title="Dashboard">
      <i class="bi bi-grid-1x2-fill"></i>
    </div>

    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="app-sidebar__item" title="Dashboard" aria-label="Dashboard">
      <i class="bi bi-house-door-fill"></i>
    </a>

    <a routerLink="/formtemplates" routerLinkActive="active" class="app-sidebar__item" title="Forms Templates" aria-label="Forms Templates">
      <i class="bi bi-file-earmark-text-fill"></i>
    </a>

    <a routerLink="/forms" routerLinkActive="active" class="app-sidebar__item" title="Publish Forms" aria-label="Publish Forms">
      <i class="bi bi-journal-check"></i>
    </a>

    <a routerLink="/submissions" routerLinkActive="active" class="app-sidebar__item" title="Submissions" aria-label="Submissions">
      <i class="bi bi-inboxes-fill"></i>
    </a>
  </nav>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
