<div class="global-loader" *ngIf="iobjloadingService.iboolLoading()">
  <div class="spinner-border text-primary" role="status"></div>
</div>
<div class="d-flex" style="min-height:100vh;">
  <nav *ngIf="iboolShowSidebar" class="bg-dark text-white p-3" style="width:220px;">
    <h5 class="mb-4">Form Generation System</h5>
    <a routerLink="/dashboard" class="d-block text-white-50 py-1 text-decoration-none">Dashboard</a>
    <a routerLink="/formtemplates" class="d-block text-white-50 py-1 text-decoration-none">Forms Templates</a>
    <a routerLink="/forms" class="d-block text-white-50 py-1 text-decoration-none">Publish Forms</a>
    <a routerLink="/forms/builder" class="d-block text-white-50 py-1 text-decoration-none">+ New Form</a>
  </nav>
  <main class="flex-grow-1">
    <router-outlet></router-outlet>
  </main>
</div>
