<div class="p-4 rules-screen">
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h3 class="mb-1 fw-bold">Validation &amp; Rules</h3>
            <div class="text-muted small">Define validation and behavior rules for your form fields.</div>
        </div>
        <a [routerLink]="['/forms/builder', inumFormId]" [queryParams]="{ version: inumVersionId }"
            class="btn btn-outline-primary">
            <i class="bi bi-arrow-left me-1"></i> Back to Design
        </a>
    </div>

    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a class="nav-link" role="button" [class.active]="istrActiveTab === 'validation'"
                (click)="switchTab('validation')">Validation Rules</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" role="button" [class.active]="istrActiveTab === 'conditional'"
                (click)="switchTab('conditional')">Conditional Rules</a>
        </li>
    </ul>

    <app-validation-rules-tab *ngIf="istrActiveTab === 'validation'" [inumVersionId]="inumVersionId"
        [iarrControls]="iarrControls" [iarrRules]="validationRules" (ichanged)="loadRules()"
        (igoToConditional)="switchTab('conditional')"></app-validation-rules-tab>

    <app-conditional-rules-tab *ngIf="istrActiveTab === 'conditional'" [inumVersionId]="inumVersionId"
        [iarrControls]="iarrControls" [iarrRules]="conditionalRules" (ichanged)="loadRules()"
        (igoToValidation)="switchTab('validation')"></app-conditional-rules-tab>
</div>
