<div class="p-4">
    <h3 class="mb-4">Dashboard</h3>
    <div class="row g-3 mb-4">
        <div class="col-3">
            <div class="card p-3">
                <div class="text-muted small">Total Forms</div>
                <div class="fs-3 fw-bold">{{ inumTotal }}</div>
            </div>
        </div>
        <!-- <div class="col-3">
            <div class="card p-3">
                <div class="text-muted small">Published</div>
                <div class="fs-3 fw-bold">{{ inumPublished }}</div>
            </div>
        </div> -->
        <div class="col-3">
            <div class="card p-3">
                <div class="text-muted small">Draft</div>
                <div class="fs-3 fw-bold">{{ inumDraft }}</div>
            </div>
        </div>
        <div class="col-3">
            <div class="card p-3">
                <div class="text-muted small">Archived</div>
                <div class="fs-3 fw-bold">{{ inumArchived }}</div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h5>Forms</h5>
        <a routerLink="/forms/builder" class="btn btn-primary btn-sm">+ Create Form</a>
    </div>

<table class="table bg-white">
    <thead>
        <tr>
            <th>Form Name</th>
            <th>Version</th>
            <th>Status</th>
            <th>Last Modified</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let v of iarrDraftVersions">
            <td>{{ v.formName }}</td>
            <td>v{{ v.versionNo }}</td>
            <td><span class="badge bg-secondary">{{ v.status }}</span></td>
            <td>{{ v.modifiedDate | date:'mediumDate' }}</td>
            <td><a [routerLink]="['/forms/builder', v.formId]" [queryParams]="{ version: v.formVersionId }">Edit</a></td>
        </tr>
        <tr *ngIf="iarrDraftVersions.length === 0">
            <td colspan="5" class="text-muted text-center">No draft versions.</td>
        </tr>
    </tbody>
</table></div>
