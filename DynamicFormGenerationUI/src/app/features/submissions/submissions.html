<div class="p-4">
    <h4 class="mb-3">Submissions</h4>
    <table class="table bg-white">
        <thead>
            <tr>
                <th>#</th>
                <th>Submitted On</th>
                <th>Submitted By</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let s of submissions">
                <td>{{ s.submissionId }}</td>
                <td>{{ s.submittedOn | date:'medium' }}</td>
                <!-- <td>{{ s.submittedByName || 'Anonymous' }}</td> -->
            </tr>
            <tr *ngIf="submissions.length === 0">
                <td colspan="3" class="text-muted text-center">No submissions yet.</td>
            </tr>
        </tbody>
    </table>
</div>
