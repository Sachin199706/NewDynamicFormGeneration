<div class="p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">
            Form Templates
        </h3>
        <button type="button" class="btn btn-primary" (click)="createFormTemplate()">
            + Create Form Template
        </button>
    </div>
    <div class="card bg-white p-3 mb-3">
        <div class="row g-3">
            <div class="col-md-5">
                <label class="form-label">
                    Search
                </label>
                <input type="text" class="form-control" placeholder="Search by template name or code..."
                    [(ngModel)]="strSearch" (ngModelChange)="onFilterChange()" />
            </div>
            <div class="col-md-2">
                <label class="form-label">
                    From Date
                </label>
                <input type="date" class="form-control" [(ngModel)]="dtFromDate" />
            </div>

            <!-- To Date -->
            <div class="col-md-2">
                <label class="form-label">
                    To Date
                </label>
                <input
                    type="date"
                    class="form-control"
                    [(ngModel)]="dtToDate">

            </div>


            <!-- Buttons -->
            <div class="col-md-3 d-flex align-items-end gap-2">

                <button
                    type="button"
                    class="btn btn-primary"
                    (click)="search()">

                    Search

                </button>

                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="clearFilters()">

                    Clear

                </button>

            </div>

        </div>

    </div>


    <!-- Templates Table -->
    <div class="table-responsive">
        <table class="table bg-white align-middle">
            <thead>
                <tr>
                    <th>Template Name</th>
                    <th>Template Code</th>
                    <th>Description</th>
                    <th>Last Modified</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let f of iarrForms">
                    <td>
                            {{ f.formName }}
                    </td>
                    <td>
                        {{ f.formCode }}
                    </td>
                    <td> <div class="text-truncate" style="max-width: 300px;" title="{{f.description}}">
                         {{ f.description }}
                    </div>
                    </td>
                    <td>
                        {{ f.modifiedDate | date:'medium' }}
                    </td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-3">
                            <a
                                [routerLink]="['/forms', f.formId]">
                                Add New Version
                            </a>
                            <button type="button" class="btn btn-link p-0" (click)="editFormTemplate(f)">
                                Edit
                            </button>
                            <button type="button" class="btn btn-link p-0" (click)="openVersions(f)">
                                Versions
                            </button>
                        </div>
                    </td>
                </tr>
                <!-- Empty -->
                <tr *ngIf="iarrForms.length === 0">

                    <td
                        colspan="6"
                        class="text-muted text-center py-4">

                        No form templates found.

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- Create Form Template -->
    <app-create-form-template
        *ngIf="isCreateTemplateVisible"
        [template]="editingTemplate"
        (templateCreated)="onTemplateCreated($event)"
        (templateUpdated)="onTemplateUpdated($event)"
        (closed)="closeCreateTemplate()">
    </app-create-form-template>

</div>
