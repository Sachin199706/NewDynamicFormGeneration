<div class="alert alert-info" *ngIf="iboolReadOnly">
    Viewing a submitted response you cannot be submited.
</div>
<div class="p-4" style="max-width:700px; margin:0 auto;" *ngIf="payload">
    <h4 class="mb-3">{{ payload.formName }}</h4>

    <form [formGroup]="form" (ngSubmit)="submit()">
        <div style="display:flex; flex-wrap:wrap; gap:12px; align-content:flex-start; align-items:flex-start;">
            <div class="mb-3" *ngFor="let c of payload.controls" [hidden]="!isVisible(c.controlKey)"
                [style.width]="'calc(' + (100 / inumColumnLayout) + '% - 12px)'">
                <label class="form-label">
                    {{ c.label }}
                    <span class="text-danger" *ngIf="isRequired(c.controlKey)">*</span>
                </label>

                <ng-container [ngSwitch]="c.controlTypeCode">
                    <textarea *ngSwitchCase="'TextArea'" class="form-control"
                        [formControlName]="c.controlKey"></textarea>

                    <select *ngSwitchCase="'Dropdown'" class="form-control" [formControlName]="c.controlKey">
                        <option value="">-- Select --</option>
                        <option *ngFor="let opt of seedOptions(c)" [value]="opt">{{ opt }}</option>
                    </select>

                    <input *ngSwitchCase="'Number'" type="number" class="form-control"
                        [formControlName]="c.controlKey" />

                    <input *ngSwitchCase="'Date'" type="date" class="form-control" [formControlName]="c.controlKey" />

                    <div *ngSwitchCase="'Radio'">
                        <div class="form-check" *ngFor="let opt of seedOptions(c)">
                            <input type="radio" class="form-check-input" [formControlName]="c.controlKey" [value]="opt"
                                [id]="c.controlKey + '_' + opt" />
                            <label class="form-check-label" [for]="c.controlKey + '_' + opt">{{ opt }}</label>
                        </div>
                    </div>

                    <div class="form-check" *ngSwitchCase="'Checkbox'">
                        <input type="checkbox" class="form-check-input" [formControlName]="c.controlKey"
                            [id]="c.controlKey" />
                        <label class="form-check-label" [for]="c.controlKey">{{ c.placeholder || c.label }}</label>
                    </div>

                    <div *ngSwitchCase="'CheckboxList'">
                        <div class="form-check" *ngFor="let opt of seedOptions(c)">
                            <input type="checkbox" class="form-check-input"
                                [checked]="isCheckboxListOptionSelected(c.controlKey, opt)"
                                (change)="toggleCheckboxListOption(c.controlKey, opt)"
                                [id]="c.controlKey + '_' + opt" />
                            <label class="form-check-label" [for]="c.controlKey + '_' + opt">{{ opt }}</label>
                        </div>
                    </div>

                    <!-- A file input can never be given a stored filename by script (browser security),
     so read-only mode renders the name and a download link instead of the input. -->
                    <div *ngSwitchCase="'File'">
                        <input *ngIf="!iboolReadOnly" type="file" class="form-control"
                            (change)="onFileSelected(c.controlKey, $event)" />

                        <div *ngIf="iboolReadOnly && storedFileName(c.controlKey)"
                            class="d-flex align-items-center gap-2">
                            <input type="text" class="form-control"
                                [value]="displayFileName(storedFileName(c.controlKey))" disabled />
                            <a class="btn btn-outline-primary btn-sm text-nowrap"
                                [href]="downloadUrl(storedFileName(c.controlKey))" target="_blank"
                                rel="noopener">Download</a>
                        </div>

                        <div *ngIf="iboolReadOnly && !storedFileName(c.controlKey)"
                            class="form-control bg-light text-muted">No file uploaded</div>
                    </div>

                    <div *ngSwitchCase="'Image'">
                        <input *ngIf="!iboolReadOnly" type="file" class="form-control"
                            [disabled]="!isEnabled(c.controlKey)" (change)="onFileSelected(c.controlKey, $event)" />

                        <img *ngIf="!iboolReadOnly && imagePreviewUrls[c.controlKey]"
                            [src]="imagePreviewUrls[c.controlKey]"
                            style="max-width:150px; max-height:150px; margin-top:8px; border-radius:6px; display:block;" />

                        <ng-container *ngIf="iboolReadOnly">
                            <div *ngIf="storedFileName(c.controlKey)">
                                <div class="d-flex align-items-center gap-2">
                                    <input type="text" class="form-control"
                                        [value]="displayFileName(storedFileName(c.controlKey))" disabled />
                                    <a class="btn btn-outline-primary btn-sm text-nowrap"
                                        [href]="downloadUrl(storedFileName(c.controlKey))" target="_blank"
                                        rel="noopener">Download</a>
                                </div>
                                <img [src]="fileUrl(storedFileName(c.controlKey))"
                                    style="max-width:150px; max-height:150px; margin-top:8px; border-radius:6px; display:block;" />
                            </div>

                            <div *ngIf="!storedFileName(c.controlKey)" class="form-control bg-light text-muted">No image
                                uploaded</div>
                        </ng-container>
                    </div>


                    <div *ngSwitchCase="'Label'" class="form-text">{{ c.placeholder }}</div>

                    <input *ngSwitchDefault type="text" class="form-control" [placeholder]="c.placeholder"
                        [formControlName]="c.controlKey" />
                </ng-container>

                <div class="text-danger small mt-1"
                    *ngIf="form.get(c.controlKey)?.touched && form.get(c.controlKey)?.errors?.['ruleFailure']">
                    {{ form.get(c.controlKey)?.errors?.['ruleFailure']?.message }}
                </div>
            </div>
        </div>

        <div class="alert alert-danger" *ngIf="serverErrors.length">
            <div *ngFor="let e of serverErrors">{{ e }}</div>
        </div>
        <div class="alert alert-success" *ngIf="submitted">Submitted successfully.</div>

        <button type="submit" class="btn btn-primary" [disabled]="form.invalid" *ngIf="!iboolReadOnly">Submit</button>
    </form>
</div>
