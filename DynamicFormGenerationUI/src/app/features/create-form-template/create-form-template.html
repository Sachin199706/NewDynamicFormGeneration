
<div class="modal fade show d-block" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!-- Header -->
            <div class="modal-header">
                <h5 class="modal-title">
                    {{ template ? 'Edit Form Template' : 'Create Form Template' }}
                </h5>
                <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
            </div>
            <div class="modal-body">
                <form [formGroup]="templateForm">
                    <div class="mb-3">
                        <label class="form-label">
                            Template Name
                            <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" formControlName="formName"
                            placeholder="Enter template name">

                        <div
                            class="text-danger small mt-1"
                            *ngIf="isInvalid('formName')">

                            Template name is required.

                        </div>

                    </div>


                    <!-- Template Code -->
                    <div class="mb-3">

                        <label class="form-label">
                            Template Code
                            <span class="text-danger">*</span>
                        </label>

                        <input
                            type="text"
                            class="form-control text-uppercase"
                            formControlName="formCode"
                            placeholder="e.g. EMP-001">

                        <div
                            class="text-danger small mt-1"
                            *ngIf="isInvalid('formCode')">

                            Template code is required.

                        </div>

                        <small class="text-muted">
                            A unique code used to identify this template.
                        </small>

                    </div>


                    <!-- Description -->
                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            rows="3"
                            formControlName="description"
                            placeholder="Enter template description">
                        </textarea>

                    </div>

                </form>

            </div>


            <!-- Footer -->
            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="close()">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    [disabled]="templateForm.invalid"
                    (click)="createTemplate()">

                    {{ template ? 'Update Template' : 'Create Template' }}

                </button>

            </div>

        </div>

    </div>

</div>
