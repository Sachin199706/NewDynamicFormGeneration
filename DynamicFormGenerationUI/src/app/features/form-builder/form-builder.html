<div class="d-flex" style="height:100vh;">

    <!-- LEFT: toolbox -->
    <div class="p-3" style="width:230px; background:#fff; border-right:1px solid #e5e7eb; overflow-y:auto;">
        <h6>Controls</h6>
        <div cdkDropList id="toolboxList" [cdkDropListConnectedTo]="['canvasList']" [cdkDropListData]="controlTypes"
            [cdkDropListSortingDisabled]="true">
            <div *ngFor="let ct of controlTypes" cdkDrag [cdkDragData]="ct" class="dfg-toolbox-item border mb-1">
                {{ ct.controlName }}
            </div>
        </div>
    </div>

    <!-- CENTER: canvas -->
    <div class="flex-grow-1 d-flex flex-column">
        <div class="p-3 border-bottom bg-white d-flex align-items-center gap-3">
            <label class="fw-bold">Form Name:</label>
            <input class="form-control" style="width:260px;" [(ngModel)]="formName" placeholder="Enter form name" />
            <button class="btn btn-primary btn-sm" (click)="save()">Save</button>
            <button class="btn btn-outline-primary btn-sm" (click)="openPreview()">
                <i class="bi"></i>Preview
            </button>
            <button class="btn btn-success btn-sm" (click)="publish()" [disabled]="!formId">Publish</button>
            <a *ngIf="formId && versionId" class="btn btn-outline-secondary btn-sm"
                [routerLink]="['/forms', formId, 'versions', versionId, 'rules']">Validation Rules</a>
        </div>

        <div class="p-3 flex-grow-1" style="overflow-y:auto;">
            <div cdkDropList id="canvasList" [cdkDropListData]="canvasControls" (cdkDropListDropped)="drop($event)"
                class="dfg-canvas-dropzone p-3">
                <div *ngIf="canvasControls.length === 0" class="text-muted text-center py-5">Drag controls here</div>

                <div *ngFor="let c of canvasControls" cdkDrag class="dfg-control-wrapper mb-2"
                    [class.selected]="selected === c" (click)="select(c)">
                    <label class="form-label small mb-1">{{ c.label }} <span *ngIf="c.isRequired"
                            class="text-danger">*</span></label>
                    <ng-container [ngSwitch]="c.controlTypeCode">
                        <textarea *ngSwitchCase="'TextArea'" class="form-control" [placeholder]="c.placeholder"
                            disabled></textarea>
                        <select *ngSwitchCase="'Dropdown'" class="form-control" disabled>
                            <option>{{ c.placeholder }}</option>
                        </select>
                        <input *ngSwitchDefault type="text" class="form-control" [placeholder]="c.placeholder"
                            disabled />
                    </ng-container>
                </div>
            </div>
        </div>
    </div>

    <!-- RIGHT: property panel -->
    <div class="p-3" style="width:280px; background:#fff; border-left:1px solid #e5e7eb; overflow-y:auto;">
        <h6>Properties</h6>
        <div *ngIf="!selected"><em class="text-muted">Select a control to edit its properties</em></div>
        <div *ngIf="selected">
            <div class="mb-2">
                <label class="form-label small">Label</label>
                <input class="form-control form-control-sm" [(ngModel)]="selected.label" />
            </div>
            <div class="mb-2">
                <label class="form-label small">Placeholder</label>
                <input class="form-control form-control-sm" [(ngModel)]="selected.placeholder" />
            </div>
            <div class="mb-2">
                <label class="form-label small">Field Key</label>
                <input class="form-control form-control-sm" [(ngModel)]="selected.controlKey" />
            </div>
            <div class="form-check mb-2">
                <input type="checkbox" class="form-check-input" [(ngModel)]="selected.isRequired" id="reqChk" />
                <label class="form-check-label small" for="reqChk">Required</label>
            </div>
            <button class="btn btn-outline-danger btn-sm w-100" (click)="removeSelected()">Delete</button>
        </div>
    </div>
</div>

<!-- PREVIEW OVERLAY: renders the same JSON (controls + rules) an end user would get,
         through the identical RuleEngineService used by the real fill-in screen. -->
<div *ngIf="previewOpen" class="preview-overlay" (click)="closePreview()">
    <div class="preview-panel" (click)="$event.stopPropagation()">
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
            <div>
                <div class="fw-bold">{{ formName || 'Untitled Form' }}</div>
                <div class="small text-muted">Preview — rules applied live, nothing is saved here</div>
            </div>
            <button class="btn btn-sm btn-outline-secondary" (click)="closePreview()">Close</button>
        </div>

        <div class="p-4" style="max-width:480px; margin:0 auto;">
            <div class="mb-3" *ngFor="let c of canvasControls" [hidden]="previewVisibility[c.controlKey] === false">
                <label class="form-label">{{ c.label }} <span *ngIf="c.isRequired" class="text-danger">*</span></label>

                <ng-container [ngSwitch]="c.controlTypeCode">
                    <textarea *ngSwitchCase="'TextArea'" class="form-control" [ngModel]="previewValues[c.controlKey]"
                        (ngModelChange)="onPreviewChange(c.controlKey, $event)"></textarea>
                    <select *ngSwitchCase="'Dropdown'" class="form-control" [ngModel]="previewValues[c.controlKey]"
                        (ngModelChange)="onPreviewChange(c.controlKey, $event)">
                        <option value="">-- Select --</option>
                        <option *ngFor="let opt of seedOptions(c)" [value]="opt">{{ opt }}</option>
                    </select>
                    <input *ngSwitchDefault type="text" class="form-control" [placeholder]="c.placeholder"
                        [ngModel]="previewValues[c.controlKey]"
                        (ngModelChange)="onPreviewChange(c.controlKey, $event)" />
                </ng-container>
            </div>

            <button class="btn btn-primary" disabled>Submit (disabled in preview)</button>
        </div>
    </div>
</div>
